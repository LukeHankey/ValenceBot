name: test

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26.13.1"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
