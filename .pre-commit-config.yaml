repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-merge-conflict
    -   id: mixed-line-ending
        args: [--fix=lf]
# Runs the prettier pinned in package.json rather than a mirrored copy:
# mirrors-prettier is archived and its last release is a 4.0 alpha, which
# formats differently from the 3.x this repo installs. Two versions meant CI
# and a local `npx prettier` disagreed about the same files.
-   repo: local
    hooks:
    -   id: prettier
        name: prettier
        entry: node node_modules/prettier/bin/prettier.cjs --write
        language: system
        types: [javascript]
# eslint runs from node_modules for the same reason as prettier above. The
# mirrors-eslint hook built its own Node with nodeenv, which tried to download
# the newest Node release and failed on its pre-release version string, and
# it linted with pinned plugin versions that differed from package.json.
-   repo: local
    hooks:
    -   id: eslint
        name: eslint
        entry: node node_modules/eslint/bin/eslint.js
        language: system
        types: [javascript]
